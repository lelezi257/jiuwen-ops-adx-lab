groups:
  - name: orders
    rules:
      - alert: OrderNoCouponErrors
        # Demo: real recurring HTTP failures, with a short confirmation period.
        expr: sum by (release_id) (increase(order_requests_total{path="/orders",status="500"}[20s])) > 1
        for: 2s
        labels:
          service: order-api
        annotations:
          summary: Order creation has real HTTP 500 errors
